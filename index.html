<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Bus Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #796C6D;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Barra superiore */
        .top-bar {
            background: white;
            width: 90%;
            max-width: 900px;
            margin-top: 40px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .top-bar h2 {
            margin: 0;
            font-size: 22px;
            color: #000;
        }

        .top-bar h4 {
            margin: 5px 0 0 0;
            font-weight: normal;
            color: #444;
        }

        /* Griglia pulsanti */
        .menu-grid {
            width: 90%;
            max-width: 900px;
            margin-top: 20px;

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        /* Pulsante */
        .menu-item {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);

            cursor: pointer;

            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;

            transition: 0.2s;
        }

        .menu-item:hover {
            background: #f7f7f7;
        }

        .menu-item img {
            width: 300px;
            height: 300px;
            object-fit: contain;
            margin-bottom: 0px;
        }

        .menu-item h3 {
            margin: 0;
            font-size: 18px;
            font-weight: bold;
            color: #000;
        }

        .menu-item p {
            margin: 5px 0 0 0;
            font-size: 14px;
            color: #666;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .top-bar {
                padding: 15px;
            }

            .top-bar h2 {
                font-size: 18px;
            }

            .top-bar h4 {
                font-size: 14px;
            }

            .menu-grid {
                gap: 12px;
            }

            .menu-item {
                padding: 15px;
            }

            .menu-item img {
                width: 200px;
                height: 70px;
            }

            .menu-item h3 {
                font-size: 16px;
            }

            .menu-item p {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <!-- Barra superiore -->
    <div class="top-bar">
        <div>
            <h1>BUS GALLERY</h1>
            <h4>Gianluca Russo & Soci</h4>
        </div>
    </div>

    <!-- Griglia pulsanti -->
    <div class="menu-grid">

        <div class="menu-item" onclick="goToPage('STAR-Mobility.html')">
            <img src="https://gianlu-russo10.github.io/BusGallery/SM-LogoThumbnail.png" alt="STAR Mobility Logo Thumbnail">
            <h3>STAR Mobility</h3>
            <p>LODI - Gruppo Zoncada</p>
        </div>

        <div class="menu-item" onclick="goToPage('Az2.html')">
            <img src="img/turni.png" alt="Azienda 2">
            <h3>*Azienda 2*</h3>
            <p>*Azienda 2*</p>
        </div>

        <div class="menu-item" onclick="goToPage('Az3.html')">
            <img src="img/ods.png" alt="Azienda 3">
            <h3>*Azienda 3*</h3>
            <p>*Azienda 3*</p>
        </div>

        <div class="menu-item" onclick="goToPage('codicidisplay.html')">
            <img src="img/display.png" alt="Azienda 4">
            <h3>*Azienda 4*</h3>
            <p>*Azienda 4*</p>
        </div>

    </div>

    <script>
        function goToPage(url) {
            window.location.href = url;
        }
    </script>

</body>

</html>
